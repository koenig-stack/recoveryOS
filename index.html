/* ─── STORAGE ─────────────────────────────────────────────────────────────── */
const LS = {
  get: (k, fb={}) => { try { return JSON.parse(localStorage.getItem(k) ?? "null") ?? fb; } catch { return fb; }},
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ─── DATE UTILS ──────────────────────────────────────────────────────────── */
function today() { return new Date().toISOString().slice(0,10); }
function wk(d=new Date()) {
  const j=new Date(d.getFullYear(),0,1);
  return `${d.getFullYear()}W${String(Math.ceil(((d-j)/86400000+j.getDay()+1)/7)).padStart(2,"0")}`;
}
function last14() {
  return Array.from({length:14},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-13+i); return d.toISOString().slice(0,10); });
}
const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];

/* Traffic-light adaptations */
const TL_ADAPT = {
  green:  { label:"🟢 Grün",  badge:"#10b981", badgeBg:"#071a12", sets:1.0, note:"Volles Training · Progressive Overload aktiv" },
  yellow: { label:"🟡 Gelb",  badge:"#f59e0b", badgeBg:"#1e1404", sets:0.75,note:"Volumen −25% · kein PR · RIR ≥ 3" },
  red:    { label:"🔴 Rot",   badge:"#f43f5e", badgeBg:"#1e040a", sets:0.5, note:"Minimal-Training · −20% Gewicht · Technikfokus" },
};

function adaptSets(base, tl) { return Math.max(2, Math.round(base * (TL_ADAPT[tl]?.sets ?? 1))); }

/* ─── SVG LINE CHART ──────────────────────────────────────────────────────── */
function LineChart({ data, color="#10b981", h=70, minLabel, maxLabel }) {
  if (!data || data.filter(d=>d.v!=null).length < 2) return (
    <div style={{height:h,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)"}}>Noch zu wenig Daten</span>
    </div>
  );
  const valid = data.filter(d=>d.v!=null);
  const vals = valid.map(d=>d.v);
  const min=Math.min(...vals), max=Math.max(...vals), range=max-min||1;
  const W=280, pad=10;
  const pts = data.map((d,i)=>{
    const x=(i/(data.length-1))*(W-2*pad)+pad;
    const y=d.v!=null ? h-pad-((d.v-min)/range)*(h-2*pad) : null;
    return {x,y,v:d.v,label:d.label};
  });
  const line=pts.filter(p=>p.y!=null).map(p=>`${p.x},${p.y}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${h}`} style={{width:"100%",height:h,overflow:"visible"}}>
      <defs>
        <linearGradient id={`grad-${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.18"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.01"/>
        </linearGradient>
      </defs>
      {pts.filter(p=>p.y!=null).length > 1 && (
        <polygon
          points={`${pts.find(p=>p.y!=null).x},${h-pad} ${line} ${pts.filter(p=>p.y!=null).slice(-1)[0].x},${h-pad}`}
          fill={`url(#grad-${color.replace("#","")})`}
        />
      )}
      <polyline points={line} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i)=> p.y!=null && (
        <circle key={i} cx={p.x} cy={p.y} r="2.5" fill={color}/>
      ))}
    </svg>
  );
}

/* ─── SMALL ATOMS ─────────────────────────────────────────────────────────── */
function Chip({ label, color, bg }) {
  return <span style={{background:bg,color,borderRadius:4,padding:"2px 8px",fontSize:10,fontFamily:"'Geist Mono',monospace",fontWeight:500,letterSpacing:0.2,whiteSpace:"nowrap"}}>{label}</span>;
}
function Chevron({ open }) {
  return (
    <svg width="14" height="14" viewBox="0 0 14 14" style={{transform:open?"rotate(180deg)":"none",transition:"transform .18s",flexShrink:0,color:"var(--t3)"}}>
      <path d="M3 5l4 4 4-4" stroke="currentColor" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function NumInput({ val, onChange, placeholder, w=70 }) {
  const [focused,setFocused]=useState(false);
  return (
    <input type="number" inputMode="decimal" placeholder={placeholder} value={val??""} onChange={e=>onChange(e.target.value)}
      onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
      style={{width:w,height:36,background:"var(--s3)",border:`1.5px solid ${focused?"var(--acc)":"var(--bd)"}`,borderRadius:8,padding:"0 8px",color:"var(--t1)",fontSize:13,fontFamily:"'Geist Mono',monospace",textAlign:"center",transition:"border-color .15s"}}
    />
  );
}
function TextInput({ val, onChange, placeholder, style={} }) {
  const [f,setF]=useState(false);
  return (
    <input type="text" placeholder={placeholder} value={val??""} onChange={e=>onChange(e.target.value)}
      onFocus={()=>setF(true)} onBlur={()=>setF(false)}
      style={{background:"var(--s3)",border:`1.5px solid ${f?"var(--acc)":"var(--bd)"}`,borderRadius:8,padding:"8px 12px",color:"var(--t1)",fontSize:13,width:"100%",transition:"border-color .15s",...style}}
    />
  );
}

/* ─── PROFILE MODAL ───────────────────────────────────────────────────────── */
function ProfileModal({ profile, onSave, onClose }) {
  const [name,setName]=useState(profile.name||"");
  const [age,setAge]=useState(profile.age||"");
  const [weight,setWeight]=useState(profile.weight||"");
  function save() {
    const w=parseFloat(weight);
    const log=[...(profile.weightLog||[])];
    const td=today();
    const last=log[log.length-1];
    if(w && (!last || last.date!==td)) log.push({date:td,val:w});
    onSave({...profile,name,age:parseInt(age)||profile.age,weight:w||profile.weight,weightLog:log});
    onClose();
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet fade" onClick={e=>e.stopPropagation()} style={{padding:"0 0 32px"}}>
        <div style={{display:"flex",justifyContent:"center",padding:"12px 0 4px"}}>
          <div style={{width:36,height:4,borderRadius:2,background:"var(--bd)"}}/>
        </div>
        <div style={{padding:"12px 20px 20px"}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,marginBottom:20}}>Profil bearbeiten</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div>
              <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginBottom:6,letterSpacing:0.8}}>NAME</div>
              <TextInput val={name} onChange={setName} placeholder="Dein Name"/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div>
                <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginBottom:6,letterSpacing:0.8}}>ALTER (J)</div>
                <input type="number" inputMode="numeric" value={age} onChange={e=>setAge(e.target.value)} placeholder="26"
                  style={{width:"100%",height:40,background:"var(--s3)",border:"1.5px solid var(--bd)",borderRadius:8,padding:"0 12px",color:"var(--t1)",fontSize:14,fontFamily:"'Geist Mono',monospace"}}/>
              </div>
              <div>
                <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginBottom:6,letterSpacing:0.8}}>GEWICHT (kg)</div>
                <input type="number" inputMode="decimal" value={weight} onChange={e=>setWeight(e.target.value)} placeholder="82.4"
                  style={{width:"100%",height:40,background:"var(--s3)",border:"1.5px solid var(--bd)",borderRadius:8,padding:"0 12px",color:"var(--t1)",fontSize:14,fontFamily:"'Geist Mono',monospace"}}/>
              </div>
            </div>
            <p style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",lineHeight:1.6}}>Gewicht wird automatisch in den Verlauf eingetragen.</p>
          </div>
          <button onClick={save} style={{marginTop:20,width:"100%",height:46,borderRadius:12,background:"var(--acc)",border:"none",color:"#fff",fontSize:14,fontWeight:700,fontFamily:"'Syne',sans-serif"}}>Speichern</button>
        </div>
      </div>
    </div>
  );
}

/* ─── DAILY CHECK-IN MODAL ────────────────────────────────────────────────── */

  const [sleep,setSleep]=useState(ex.sleep||"");
  const [tl,setTl]=useState(ex.tl||"green");
  function save() {
    onSave({...daily,[td]:{...ex,hrv:parseFloat(hrv)||undefined,sleep:parseFloat(sleep)||undefined,tl}});
    onClose();
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet fade" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"center",padding:"12px 0 4px"}}>
          <div style={{width:36,height:4,borderRadius:2,background:"var(--bd)"}}/>
        </div>
        <div style={{padding:"12px 20px"}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,marginBottom:4}}>Tages-Check · {td}</div>
          <p style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginBottom:20}}>Morgens ausfüllen — bestimmt deinen Trainingstag</p>

          <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginBottom:8,letterSpacing:0.8}}>BEREITSCHAFTS-AMPEL</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:20}}>
            {Object.entries(TL_ADAPT).map(([k,v])=>(

            </div>
            <div>
              <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginBottom:6,letterSpacing:0.8}}>SCHLAF (h)</div>
              <input type="number" inputMode="decimal" value={sleep} onChange={e=>setSleep(e.target.value)} placeholder="z.B. 7.5"
                style={{width:"100%",height:40,background:"var(--s3)",border:"1.5px solid var(--bd)",borderRadius:8,padding:"0 12px",color:"var(--t1)",fontSize:14,fontFamily:"'Geist Mono',monospace"}}/>
            </div>
          </div>
          <button onClick={save} style={{width:"100%",height:46,borderRadius:12,background:"var(--acc)",border:"none",color:"#fff",fontSize:14,fontWeight:700,fontFamily:"'Syne',sans-serif"}}>Eintragen</button>
        </div>
      </div>
    </div>
  );
}

/* ─── DAY PICKER MODAL ────────────────────────────────────────────────────── */
function DayPicker({ day, current, onPick, onClose }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet fade" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"center",padding:"12px 0 4px"}}>
          <div style={{width:36,height:4,borderRadius:2,background:"var(--bd)"}}/>
        </div>
        <div style={{padding:"8px 20px 0"}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:800,marginBottom:4}}>{day} — Session wählen</div>
          <p style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginBottom:16}}>Plan diese Woche flexibel anpassen</p>
        </div>
        {SESSION_OPTS.map(opt=>{
          const active=current===opt.id;
          const typeColor=opt.type==="training"?SESSIONS[opt.id]?.colorRaw||"#6366f1":opt.type==="cardio"?"#6366f1":opt.type==="recovery"?"#8b5cf6":"var(--t3)";
          return (
            <div key={opt.id} onClick={()=>{onPick(opt.id);onClose();}}
              style={{display:"flex",alignItems:"center",gap:12,padding:"13px 20px",borderTop:"1px solid var(--bd)",cursor:"pointer",background:active?"var(--s3)":"transparent",transition:"background .1s"}}>
              <span style={{fontSize:20}}>{opt.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:700,color:active?typeColor:"var(--t1)"}}>{opt.label}</div>
                {SESSIONS[opt.id] && <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginTop:1}}>{SESSIONS[opt.id].desc}</div>}
              </div>
              {active && <div style={{width:8,height:8,borderRadius:"50%",background:typeColor,flexShrink:0}}/>}
            </div>
          );
        })}
        <div onClick={()=>{onPick(null);onClose();}} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 20px",borderTop:"1px solid var(--bd)",cursor:"pointer"}}>
          <span style={{fontSize:20}}>✕</span>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:700,color:"var(--t3)"}}>Kein Eintrag</div>
        </div>
      </div>
    </div>
  );
}

/* ─── EXERCISE CARD ───────────────────────────────────────────────────────── */
function ExCard({ ex, sessionId, tl, date, log, onLog, active, onToggle }) {
  const [open,setOpen]=useState(false);
  const adaptedSets=adaptSets(ex.sets,tl);
  const logKey=`${date}_${sessionId}_${ex.id}`;
  const sets=log[logKey]||Array.from({length:adaptedSets},()=>({kg:"",reps:"",done:false}));
  const doneCount=sets.filter(s=>s.done).length;
  const allDone=doneCount>=adaptedSets;
  const tlData=TL_ADAPT[tl];

  function updateSet(i,field,val) {
    const next=[...sets];
    while(next.length<adaptedSets) next.push({kg:"",reps:"",done:false});
    next[i]={...next[i],[field]:val};
    onLog(logKey,next);
  }

  const typeColors={kraft:{bg:"#1a0a0e",c:"#f43f5e"},hyp:{bg:"#0a0a1e",c:"#6366f1"},iso:{bg:"#0a1a1a",c:"#22d3ee"},health:{bg:"#071a12",c:"#10b981"}};
  const tc=typeColors[ex.type]||typeColors.iso;

  return (
    <div style={{borderBottom:"1px solid var(--bd)",opacity:active?1:0.35,transition:"opacity .2s"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",cursor:"pointer"}} onClick={()=>active&&setOpen(o=>!o)}>
        {/* toggle */}
        <div onClick={e=>{e.stopPropagation();onToggle();}} style={{width:20,height:20,borderRadius:6,border:`1.5px solid ${active?"var(--acc)":"var(--bd)"}`,background:active?"var(--acc)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .15s"}}>
          {active&&<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l2 2 4-4" stroke="#fff" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
            <span style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:700,color:"var(--t1)"}}>{ex.name}</span>
            <span style={{background:tc.bg,color:tc.c,borderRadius:4,padding:"1px 6px",fontSize:9,fontFamily:"'Geist Mono',monospace",fontWeight:600,textTransform:"uppercase"}}>{ex.type}</span>
          </div>
          <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginTop:2}}>
            {adaptedSets}×{ex.sets!==adaptedSets?<span style={{color:tlData.badge}}>{adaptedSets}</span>:ex.sets} · {ex.reps} · {ex.rest}
            {ex.sets!==adaptedSets&&<span style={{color:tlData.badge,marginLeft:4}}>({tl})</span>}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          {doneCount>0&&<span style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:allDone?"var(--grn)":"var(--t3)"}}>{doneCount}/{adaptedSets}</span>}
          {active&&<Chevron open={open}/>}
        </div>
      </div>
      {open&&active&&(
        <div style={{padding:"4px 16px 14px 46px"}}>
          {tl!=="green"&&<div style={{padding:"7px 10px",background:tlData.badgeBg,border:`1px solid ${tlData.badge}30`,borderRadius:8,marginBottom:10}}>
            <span style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:tlData.badge}}>{tlData.note}</span>
          </div>}
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {Array.from({length:adaptedSets}).map((_,i)=>{
              const s=sets[i]||{};
              return (
                <div key={i} style={{display:"flex",alignItems:"center",gap:7}}>
                  <span style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",minWidth:32}}>S{i+1}</span>
                  <NumInput val={s.kg} onChange={v=>updateSet(i,"kg",v)} placeholder="kg" w={68}/>
                  <span style={{color:"var(--t3)",fontSize:12}}>×</span>
                  <NumInput val={s.reps} onChange={v=>updateSet(i,"reps",v)} placeholder="Wdh" w={60}/>
                  <button onClick={()=>updateSet(i,"done",!s.done)} style={{width:36,height:36,borderRadius:8,border:`1.5px solid ${s.done?"var(--grn)":"var(--bd)"}`,background:s.done?"var(--grn-bg)":"transparent",color:s.done?"var(--grn)":"var(--t3)",fontSize:11,transition:"all .15s",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {s.done?"✓":"○"}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/*  TAB: WOCHE                                                                 */
/* ═══════════════════════════════════════════════════════════════════════════ */
function WocheTab({ daily, workoutLog, setWorkoutLog, exToggles, setExToggles }) {
  const week=wk();
  const [weekPlan,setWeekPlanState]=useState(()=>LS.get("ros_week",{}));
  const [pickerDay,setPickerDay]=useState(null);
  const [activeDay,setActiveDay]=useState(()=>{const d=new Date().getDay();return DAYS[d===0?6:d-1];});
  const td=today();
  const tl=(daily[td]||{}).tl||"green";
  const tlData=TL_ADAPT[tl];

  function setPlan(plan) { setWeekPlanState(plan); LS.set("ros_week",plan); }
  function assignDay(day,session) {
    const curr=weekPlan[week]||{};
    setPlan({...weekPlan,[week]:{...curr,[day]:session}});
  }

  const plan=weekPlan[week]||{};
  const assignedSession=plan[activeDay];
  const sessionData=SESSIONS[assignedSession];

  /* toggles */
  function getToggles(sId) {
    if(!sId||!SESSIONS[sId]) return [];
    const allIds=SESSIONS[sId].exercises.map(e=>e.id);
    if(!exToggles[sId]) return allIds;
    return exToggles[sId];
  }
  function toggleEx(sId,exId) {
    const curr=getToggles(sId);
    const next=curr.includes(exId)?curr.filter(x=>x!==exId):[...curr,exId];
    const updated={...exToggles,[sId]:next};
    setExToggles(updated); LS.set("ros_ex_toggles",updated);
  }

  /* workout progress ring */
  const activeToggled=getToggles(assignedSession);
  const totalEx=sessionData?.exercises.filter(e=>activeToggled.includes(e.id)).length||0;
  const doneEx=sessionData?.exercises.filter(e=>{
    if(!activeToggled.includes(e.id)) return false;
    const k=`${td}_${assignedSession}_${e.id}`;
    const s=workoutLog[k]||[];
    return s.filter(x=>x.done).length>=adaptSets(e.sets,tl);
  }).length||0;
  const pct=totalEx?Math.round((doneEx/totalEx)*100):0;

  return (
    <div>
      {/* Week planner */}
      <div style={{padding:"20px 20px 14px"}}>
        <div style={{fontFamily:"'Geist Mono',monospace",fontSize:9,color:"var(--t3)",letterSpacing:1,marginBottom:8}}>WOCHENPLAN — {week}</div>
        <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:4}}>
          {DAYS.map(d=>{
            const s=plan[d];
            const opt=SESSION_OPTS.find(o=>o.id===s);
            const isActive=d===activeDay;
            const sData=SESSIONS[s];
            const col=sData?.colorRaw||"var(--t3)";
            return (
              <div key={d} style={{flex:1,minWidth:40}}>
                <div onClick={()=>setActiveDay(d)}
                  style={{textAlign:"center",padding:"8px 4px",borderRadius:10,background:isActive?"var(--acc)":s?"var(--s3)":"var(--s2)",border:`1px solid ${isActive?"var(--acc)":s?col+"40":"var(--bd)"}`,cursor:"pointer",transition:"all .15s",marginBottom:4}}>
                  <div style={{fontFamily:"'Geist Mono',monospace",fontSize:9,color:isActive?"rgba(255,255,255,0.6)":"var(--t3)",marginBottom:3}}>{d}</div>
                  <div style={{fontSize:14}}>{opt?.icon||"·"}</div>
                  <div style={{fontFamily:"'Geist Mono',monospace",fontSize:9,color:isActive?"#fff":s?col:"var(--t3)",marginTop:2,fontWeight:600}}>{opt?.label||"–"}</div>
                </div>
                <div onClick={()=>setPickerDay(d)}
                  style={{height:22,display:"flex",alignItems:"center",justifyContent:"center",background:"var(--s3)",borderRadius:6,cursor:"pointer",border:"1px solid var(--bd)"}}>
                  <span style={{fontSize:10,color:"var(--t3)"}}>✎</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Divider */}
      <div style={{height:1,background:"var(--bd)",margin:"0 20px"}}/>

      {/* Today's workout */}
      <div style={{padding:"14px 20px 0"}}>
        {!assignedSession ? (
          <div style={{textAlign:"center",padding:"32px 0"}}>
            <div style={{fontSize:32,marginBottom:8}}>😴</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,color:"var(--t2)"}}>Kein Training für {activeDay}</div>
            <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginTop:4}}>Tippe ✎ um eine Session zuzuweisen</div>
          </div>
        ) : !sessionData ? (
          <div style={{textAlign:"center",padding:"32px 0"}}>
            <div style={{fontSize:32,marginBottom:8}}>{SESSION_OPTS.find(o=>o.id===assignedSession)?.icon}</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,color:"var(--t2)"}}>{SESSION_OPTS.find(o=>o.id===assignedSession)?.label}</div>
            <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t3)",marginTop:4}}>Aktive Erholung — kein Kraft-Training</div>
          </div>
        ) : (
          <>
            {/* Session header */}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <div>
                <div style={{fontFamily:"'Geist Mono',monospace",fontSize:9,color:sessionData.colorRaw,letterSpacing:1,fontWeight:600,textTransform:"uppercase",marginBottom:3}}>{activeDay} · {sessionData.label}</div>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800}}>{sessionData.desc}</div>
              </div>
              {/* Progress ring */}
              <div style={{position:"relative",width:52,height:52,flexShrink:0}}>
                <svg width="52" height="52" viewBox="0 0 52 52" style={{transform:"rotate(-90deg)"}}>
                  <circle cx="26" cy="26" r="22" fill="none" stroke="var(--bd)" strokeWidth="3"/>
                  <circle cx="26" cy="26" r="22" fill="none" stroke={sessionData.colorRaw} strokeWidth="3"
                    strokeDasharray={`${2*Math.PI*22}`} strokeDashoffset={`${2*Math.PI*22*(1-pct/100)}`}
                    strokeLinecap="round" style={{transition:"stroke-dashoffset .4s"}}/>
                </svg>
                <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Geist Mono',monospace",fontSize:11,fontWeight:600,color:"var(--t1)"}}>{pct}%</div>
              </div>
            </div>

            {/* Ampel note */}
            <div style={{padding:"8px 12px",background:tlData.badgeBg,border:`1px solid ${tlData.badge}30`,borderRadius:9,marginBottom:12}}>
              <span style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:tlData.badge}}>{tlData.label} — {tlData.note}</span>
            </div>
          </>
        )}
      </div>

      {/* Exercises */}
      {sessionData && (
        <div style={{marginTop:4}}>
          {sessionData.exercises.map(ex=>(
            <ExCard key={ex.id}
              ex={ex} sessionId={assignedSession} tl={tl} date={td}
              log={workoutLog}
              onLog={(k,v)=>{ const u={...workoutLog,[k]:v}; setWorkoutLog(u); LS.set("ros_wlog",u); }}
              active={getToggles(assignedSession).includes(ex.id)}
              onToggle={()=>toggleEx(assignedSession,ex.id)}
            />
          ))}
        </div>
      )}

      {pickerDay&&<DayPicker day={pickerDay} current={plan[pickerDay]} onPick={s=>assignDay(pickerDay,s)} onClose={()=>setPickerDay(null)}/>}
    </div>
  );
}

function StackTab() {
  const [openS,setOpenS]=useState(null);
  const [showNut,setShowNut]=useState(false);
  const flagC={Immun:{bg:"#071a12",c:"#10b981"},"Antiinfl.":{bg:"#071212",c:"#f43f5e"},Performance:{bg:"#1e1404",c:"#f59e0b"},Hypertrophie:{bg:"#0a0a1e",c:"#6366f1"},Recovery:{bg:"#111118",c:"#8888aa"},Schlaf:{bg:"#130a1e",c:"#8b5cf6"},Adaptogen:{bg:"#130a1e",c:"#8b5cf6"},Darm:{bg:"#071a12",c:"#10b981"}};
  return (
    <div>
      <div style={{padding:"20px 20px 16px",display:"flex",gap:8}}>
        <button onClick={()=>setShowNut(false)} style={{flex:1,height:36,borderRadius:9,border:`1.5px solid ${!showNut?"var(--acc)":"var(--bd)"}`,background:!showNut?"var(--acc)":"transparent",color:"#fff",fontSize:11,fontFamily:"'Geist Mono',monospace",fontWeight:600}}>Supplements</button>
        <button onClick={()=>setShowNut(true)}  style={{flex:1,height:36,borderRadius:9,border:`1.5px solid ${showNut?"var(--acc)":"var(--bd)"}`,background:showNut?"var(--acc)":"transparent",color:"#fff",fontSize:11,fontFamily:"'Geist Mono',monospace",fontWeight:600}}>Ernährung</button>
      </div>
      {!showNut ? (
        <div style={{padding:"0 20px",display:"flex",flexDirection:"column",gap:16,paddingBottom:24}}>
          <div style={{padding:"10px 14px",background:"var(--red-bg)",border:"1px solid var(--red)30",borderRadius:9}}>
            <p style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--red)",lineHeight:1.6}}>⚠️ Supplements füllen Lücken — ersetzen keine Grundlage. Vor Langzeit-Einnahme: D3, Zink, Omega-3 per Blutbild prüfen.</p>
          </div>
          {STACK_DATA.map((g,gi)=>(
            <div key={gi}>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,color:g.col,marginBottom:8}}>{g.time}</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {g.items.map((item,ii)=>{
                  const k=`${gi}-${ii}`;const fc=flagC[item.flag]||flagC.Recovery;
                  return (
                    <div key={ii} style={{background:"var(--s2)",borderRadius:10,border:"1px solid var(--bd)",overflow:"hidden"}}>
                      <div onClick={()=>setOpenS(openS===k?null:k)} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",cursor:"pointer"}}>
                        <div style={{flex:1}}>
                          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:2,flexWrap:"wrap"}}>
                            <span style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700}}>{item.n}</span>
                            <span style={{background:fc.bg,color:fc.c,borderRadius:4,padding:"1px 6px",fontSize:9,fontFamily:"'Geist Mono',monospace",fontWeight:600}}>{item.flag}</span>
                          </div>
                          <div style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t2)",fontWeight:500}}>{item.d}</div>
                        </div>
                        <Chevron open={openS===k}/>
                      </div>
                      {openS===k&&<div style={{borderTop:"1px solid var(--bd)",padding:"10px 14px",background:"var(--s3)"}}>
                        <p style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t2)",lineHeight:1.6}}>{item.why}</p>
                      </div>}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div style={{padding:"0 20px",display:"flex",flexDirection:"column",gap:8,paddingBottom:24}}>
          {NUT_DATA.map((n,i)=>(
            <div key={i} style={{background:"var(--s2)",borderRadius:"var(--r)",border:"1px solid var(--bd)",padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <span style={{fontSize:20}}>{n.icon}</span>
                <span style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:700}}>{n.title}</span>
              </div>
              <p style={{fontFamily:"'Geist Mono',monospace",fontSize:10,color:"var(--t2)",lineHeight:1.7}}>{n.body}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  return (

      <div style={{maxWidth:540,margin:"0 auto"}}>

        <div style={{maxWidth:540,margin:"0 auto",display:"flex"}}>
          {TABS.map(t=>{
            const active=tab===t.id;

    </div>
  );
}
